[defaults]
# インベントリファイルのパス
inventory = ./inventory

# SSH接続設定
host_key_checking = False
timeout = 30
remote_user = ubuntu

# ログ設定
log_path = ./ansible.log

# 並列実行数
forks = 5

# SSH接続の再試行
retries = 3

# カラー出力
force_color = True

# 実行結果の表示形式
stdout_callback = yaml
bin_ansible_callbacks = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# SSH接続のパイプライン化（高速化）
pipelining = True

# SSH接続タイムアウト
timeout = 30

# SSH制御パスの設定
control_path = %(directory)s/%%h-%%r
